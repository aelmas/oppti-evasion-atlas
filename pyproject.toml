[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "oppti-immune"
version         = "1.0.0"
description     = "Pan-cancer proteogenomic outlier analysis of immune evasion proteins"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [{ name = "Abdulkadir Elmas" }]
keywords        = ["proteomics", "immunotherapy", "cancer", "OPPTI", "multi-omics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pyarrow>=12.0",
  "cptac>=1.5",
  "mygene>=3.2",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "lifelines>=0.27",
  "requests>=2.31",
  "networkx>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "black", "ruff"]

[project.urls]
Homepage   = "https://github.com/<your-org>/oppti-immune-evasion"
Repository = "https://github.com/<your-org>/oppti-immune-evasion"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select      = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
